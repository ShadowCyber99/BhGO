server {
    # Listen on standard HTTP port
    listen 80 default_server;
    listen [::]:80 default_server;

    # Your Domain Name
    server_name superappcab.duckdns.org;

    # Directory where the built React/Expo files are stored
    root /var/www/html;
    index index.html index.htm;

    # 1. Serve the Frontend App
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy for Backend API (Forwards requests to Node.js on port 5000)
    location /api/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. Reverse Proxy for Real-Time Socket.io
    location /socket.io/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
